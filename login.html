<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VoteSecure</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-vote-yea"></i></div>
                <span class="brand-name">VoteSecure</span>
            </div>
            <h1>Welcome Back</h1>
            <p>Please login to your voter account</p>
        </div>

        <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope i-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email">
                </div>
                <small class="err" id="emailErr"></small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <div class="row-label">
                    <label for="password">Password</label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>
                <div class="input-wrap">
                    <i class="fas fa-lock i-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                    <i class="fas fa-eye-slash toggle-eye" id="togglePwd"></i>
                </div>
                <small class="err" id="passwordErr"></small>
            </div>

            <button type="submit" class="btn-primary">
                <i class="fas fa-sign-in-alt" style="margin-right:6px"></i>Login
            </button>
        </form>

        <div class="divider">or</div>

        <p style="text-align:center;font-size:13px;color:#999;margin-bottom:4px">
            Demo credentials: <strong>any registered email + password</strong>
        </p>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html" class="link">Sign Up</a>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
