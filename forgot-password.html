<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — VoteSecure</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">

        <!-- STEP 1: Enter Email -->
        <div id="step1">
            <div class="auth-header">
                <div class="brand">
                    <div class="brand-icon"><i class="fas fa-vote-yea"></i></div>
                    <span class="brand-name">VoteSecure</span>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your registered email and we'll send a reset code.</p>
            </div>

            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope i-icon"></i>
                        <input type="email" id="resetEmail" placeholder="Enter your registered email">
                    </div>
                    <small class="err" id="resetEmailErr"></small>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-paper-plane" style="margin-right:6px"></i>Send Reset Code
                </button>
            </form>

            <div class="auth-footer" style="margin-top:20px">
                <a href="login.html" class="link">
                    <i class="fas fa-arrow-left" style="margin-right:4px"></i> Back to Login
                </a>
            </div>
        </div>

        <!-- STEP 2: Enter Code + New Password -->
        <div id="step2" class="hidden">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter the code sent to <strong id="sentToEmail"></strong> and set a new password.</p>
            </div>

            <form id="resetForm" novalidate>
                <div class="form-group">
                    <label for="resetCode">Reset Code</label>
                    <div class="input-wrap">
                        <i class="fas fa-key i-icon"></i>
                        <input type="text" id="resetCode" placeholder="6-digit code" maxlength="6">
                    </div>
                    <small class="err" id="resetCodeErr"></small>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock i-icon"></i>
                        <input type="password" id="newPassword" placeholder="Create new password">
                        <i class="fas fa-eye-slash toggle-eye" id="toggleNewPwd"></i>
                    </div>
                    <small class="hint">Min. 8 chars with uppercase, number and special character.</small>
                    <small class="err" id="newPasswordErr"></small>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock i-icon"></i>
                        <input type="password" id="confirmNewPassword" placeholder="Re-enter new password">
                        <i class="fas fa-eye-slash toggle-eye" id="toggleConfirmNewPwd"></i>
                    </div>
                    <small class="err" id="confirmNewPasswordErr"></small>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-check-circle" style="margin-right:6px"></i>Reset Password
                </button>
            </form>

            <div class="auth-footer" style="margin-top:16px">
                <button class="btn-text" id="tryAgainBtn">
                    <i class="fas fa-redo" style="margin-right:4px"></i>Use a different email
                </button>
            </div>
        </div>

        <!-- STEP 3: Success -->
        <div id="step3" class="hidden" style="text-align:center;padding:20px 0">
            <div style="width:70px;height:70px;background:linear-gradient(135deg,#43a047,#2e7d32);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 6px 20px rgba(46,125,50,.3)">
                <i class="fas fa-check" style="font-size:32px;color:#fff"></i>
            </div>
            <h2 style="font-size:22px;font-weight:700;color:#2e7d32;margin-bottom:10px">Password Reset!</h2>
            <p style="color:#666;font-size:14px;margin-bottom:24px">Your password has been updated successfully.</p>
            <a href="login.html" class="btn-primary" style="display:inline-block;width:auto;padding:12px 30px;text-decoration:none">
                <i class="fas fa-sign-in-alt" style="margin-right:6px"></i>Login Now
            </a>
        </div>

    </div>
</div>

<div id="toast-container"></div>
<script src="forgot-script.js"></script>
</body>
</html>
